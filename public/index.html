<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>BuddyFM</title>
	<link rel="stylesheet" href="index.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
	<h1>BuddyFM!</h1>

	<div id="main-section">

		<div id="auth-section"></div>

		<hr>

		<h2>Scrobble Transfer</h2>
		<form id="transfer-form">
			<input type="text" id="transfer-source" placeholder="Friend's username" required>
			<input type="datetime-local" id="transfer-from" required>
			<input type="datetime-local" id="transfer-to" required>
			<button type="submit">Transfer</button>
		</form>
		<pre id="transfer-result"></pre>

		<hr>

		<h2>Real-Time Sync</h2>
		<input type="text" id="sync-source" placeholder="Friend's username">
		<button id="sync-start-btn">Start</button>
		<button id="sync-stop-btn">Stop</button>
		<pre id="sync-result"></pre>
	</div>

	<div class="ondebox">
	  <svg class="onde" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
	       viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
	    <defs>
	      <path id="onda" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352Z" />
	    </defs>
	    <g class="parallaxonde">
	      <use xlink:href="#onda" x="48" y="0" fill="rgba(255,2455,222,0.4)" />
	      <use xlink:href="#onda" x="48" y="3" fill="rgba(255,2455,222,0.2)" />
	      <use xlink:href="#onda" x="48" y="5" fill="rgba(255,2455,222,0.1)" />
	      <use xlink:href="#onda" x="48" y="7" fill="#a31212" />
	    </g>
	  </svg>
	</div>

	<script>
		async function checkAuth() {
			const res = await fetch('/auth/me');
			const data = await res.json();
			const section = document.getElementById('auth-section');
			if (data.username) {
				section.innerHTML = `<span>Logged in as <span class="username">${data.username}</span></span> <button id="logout-btn">Log out</button>`;
				document.getElementById('logout-btn').addEventListener('click', async () => {
					await fetch('/auth/logout', { method: 'POST' });
					checkAuth(); });
			} else { section.innerHTML = `<a href="/auth/login">Log in with Last.fm</a>`; }
		}
		checkAuth();

		document.getElementById('transfer-form').addEventListener('submit', async (e) => {
			e.preventDefault();
			const source_user = document.getElementById('transfer-source').value;
			const fromVal = document.getElementById('transfer-from').value;
			const toVal = document.getElementById('transfer-to').value;

			const from = Math.floor(new Date(fromVal).getTime() / 1000);
			const to = Math.floor(new Date(toVal).getTime() / 1000);

			const resultEl = document.getElementById('transfer-result');
			resultEl.textContent = 'Transferring...';

			try {
				const res = await fetch('/transfer', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ source_user, from, to }),
				});
				const data = await res.json();
				if (!res.ok) {
					resultEl.textContent = `Error: ${data.error || 'Something went wrong'}`; } 
				else {
					resultEl.textContent = data.message }
			} catch (err) { resultEl.textContent = `Error: ${err}`; }
		});

		document.getElementById('sync-start-btn').addEventListener('click', async () => {
			const source_user = document.getElementById('sync-source').value;
			const resultEl = document.getElementById('sync-result');
			resultEl.textContent = 'Starting...';

			try {
				const res = await fetch('/sync/start', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ source_user }),
				});
				const data = await res.json();
				if (!res.ok) {
					resultEl.textContent = `Error: ${data.error || 'Something went wrong'}`; } 
				else {
					resultEl.textContent = data.message; }
			} catch (err) { resultEl.textContent = `Error: ${err}`; }
		});

		document.getElementById('sync-stop-btn').addEventListener('click', async () => {
			const resultEl = document.getElementById('sync-result');
			resultEl.textContent = 'Stopping...';

			try {
				const res = await fetch('/sync/stop', { method: 'POST' });
				const data = await res.json();
				if (!res.ok) {
					resultEl.textContent = `Error: ${data.error || 'Something went wrong'}`; } 
				else {
					resultEl.textContent = data.message; }
			} catch (err) { resultEl.textContent = `Error: ${err}`; }
		});
	</script>
</body>
</html>
